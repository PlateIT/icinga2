/*
 * Immutable container integration. Deployment-specific values are resolved
 * directly from the process environment; no configuration is written to the
 * persistent data volume during startup.
 */

if (getenv("ICINGA2_API_USER") != "") {
  object ApiUser getenv("ICINGA2_API_USER") {
    password = getenv("ICINGA2_API_PASSWORD")
    permissions = [ "*" ]
  }
}

if (getenv("ICINGADB_REDIS_HOST") != "") {
  object IcingaDB "icingadb" {
    host = getenv("ICINGADB_REDIS_HOST")
    port = 6379
  }
}

if (getenv("ICINGA2_OTLP_METRICS_ENABLED") == "true") {
  object OTLPMetricsWriter "otlp-metrics" {
    host = getenv("ICINGA2_OTLP_METRICS_HOST")
    port = 4318
    metrics_endpoint = "/v1/metrics"
    service_namespace = getenv("ICINGA2_OTLP_SERVICE_NAMESPACE")
    enable_ha = true
    enable_send_thresholds = true
    flush_interval = 15s
    enable_tls = false
  }
}
